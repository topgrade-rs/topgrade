name: 'Lint PR'

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main:
    name: Validate PR title # zizmor: ignore[concurrency-limits] see above
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # amannn/action-semantic-pull-request
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
